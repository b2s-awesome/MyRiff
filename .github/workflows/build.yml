name: Build MyRiff

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'release/v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require committed lockfile
        run: test -f package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Source sanity
        run: npm run lint:source
      - name: TypeScript syntax transpilation
        run: npm run lint:syntax
      - name: Tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Renderer and main-process build
        run: npm run build

  prepare-release:
    name: Prepare draft release
    if: startsWith(github.ref, 'refs/heads/release/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - name: Resolve release tag and channel
        id: meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#release/}"
          if [[ "$tag" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Create draft release at the validated commit
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true

  build:
    name: Build ${{ matrix.platform }}
    needs: [validate, prepare-release]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            script: dist:win
          - os: macos-latest
            platform: macOS ARM64
            script: dist:mac
          - os: macos-15-intel
            platform: macOS Intel
            script: dist:mac
          - os: ubuntu-latest
            platform: Linux
            script: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux Electron libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libasound2t64 libx11-xcb1 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgtk-3-0 libdrm2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build application and installer
        run: npm run ${{ matrix.script }}
      - name: Smoke-test packaged Linux app under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:packaged
      - name: Smoke-test packaged app on Windows/macOS
        if: runner.os != 'Linux'
        run: npm run smoke:packaged
      - name: Upload Windows installer directly to draft release
        if: needs.prepare-release.result == 'success' && matrix.platform == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/*.exe --clobber
      - name: Upload macOS disk image directly to draft release
        if: needs.prepare-release.result == 'success' && startsWith(matrix.platform, 'macOS')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/*.dmg --clobber
      - name: Upload Linux packages directly to draft release
        if: needs.prepare-release.result == 'success' && matrix.platform == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/*.AppImage release/*.deb release/*.tar.gz --clobber

  publish-release:
    name: Publish verified release
    if: >-
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.build.result == 'success'
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Verify release assets and publish after all smoke tests pass
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          RELEASE_PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL:-https://api.github.com}"
          auth_header="Authorization: Bearer $GH_TOKEN"
          accept_header="Accept: application/vnd.github+json"
          version_header="X-GitHub-Api-Version: 2022-11-28"

          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The draft-release action did not provide a valid release ID."
            exit 1
          fi

          release_json="$(curl --fail-with-body --silent --show-error \
            -H "$auth_header" -H "$accept_header" -H "$version_header" \
            "$api/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          release_tag="$(jq -r '.tag_name // empty' <<< "$release_json")"
          if [[ "$release_tag" != "$RELEASE_TAG" ]]; then
            echo "::error::Release ID $RELEASE_ID belongs to '$release_tag', not '$RELEASE_TAG'."
            exit 1
          fi

          asset_names="$(jq -r '.assets[].name' <<< "$release_json")"
          dmg_count="$(grep -Ec '\.dmg$' <<< "$asset_names" || true)"
          if (( dmg_count < 2 )); then
            echo "::error::Expected both Apple Silicon and Intel macOS disk images; found $dmg_count."
            printf '%s\n' "$asset_names"
            exit 1
          fi
          for ext in '.exe' '.dmg' '.AppImage' '.deb' '.tar.gz'; do
            if ! grep -Fq "$ext" <<< "$asset_names"; then
              echo "::error::Release $RELEASE_TAG is missing a required $ext package."
              printf '%s\n' "$asset_names"
              exit 1
            fi
          done

          payload="$(jq -n --arg prerelease "$RELEASE_PRERELEASE" \
            '{draft: false, prerelease: ($prerelease == "true")}')"
          published_json="$(curl --fail-with-body --silent --show-error \
            -X PATCH -H "$auth_header" -H "$accept_header" -H "$version_header" \
            -H 'Content-Type: application/json' \
            --data "$payload" "$api/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          if [[ "$(jq -r '.draft' <<< "$published_json")" != "false" ]]; then
            echo "::error::GitHub did not confirm that release $RELEASE_TAG was published."
            exit 1
          fi
          echo "Published $RELEASE_TAG with $(jq '.assets | length' <<< "$published_json") assets."
