name: Build MyRiff

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'release/v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require committed lockfile
        run: test -f package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Source sanity
        run: npm run lint:source
      - name: TypeScript syntax transpilation
        run: npm run lint:syntax
      - name: Tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Renderer and main-process build
        run: npm run build

  prepare-release:
    name: Prepare draft release
    if: startsWith(github.ref, 'refs/heads/release/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - name: Resolve release tag and channel
        id: meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#release/}"
          if [[ "$tag" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Align an existing tag to the exact release commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$RELEASE_SHA" -F force=true
          fi
      - name: Create draft release at the validated commit
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true

  build:
    name: Build ${{ matrix.platform }}
    needs: [validate, prepare-release]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            script: dist:win
          - os: macos-latest
            platform: macOS
            script: dist:mac
          - os: ubuntu-latest
            platform: Linux
            script: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux Electron libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libasound2t64 libx11-xcb1 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgtk-3-0 libdrm2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build application and installer
        run: npm run ${{ matrix.script }}
      - name: Smoke-test packaged Linux app under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:packaged
      - name: Smoke-test packaged app on Windows/macOS
        if: runner.os != 'Linux'
        run: npm run smoke:packaged
      - name: Upload Windows installer directly to draft release
        if: needs.prepare-release.result == 'success' && matrix.platform == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/*.exe --clobber
      - name: Upload macOS disk image directly to draft release
        if: needs.prepare-release.result == 'success' && matrix.platform == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/*.dmg --clobber
      - name: Upload Linux packages directly to draft release
        if: needs.prepare-release.result == 'success' && matrix.platform == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/*.AppImage release/*.deb release/*.tar.gz --clobber

  publish-release:
    name: Publish verified release
    if: >-
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.build.result == 'success'
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish only after every platform build and smoke test passes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          RELEASE_PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          release_id="$RELEASE_ID"
          version="${RELEASE_TAG#v}"
          stale_assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq --arg version "$version" '.[] | select(.name | contains($version) | not) | .id')"
          while IFS= read -r asset_id; do
            [[ -z "$asset_id" ]] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done <<< "$stale_assets"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -F prerelease="$RELEASE_PRERELEASE" -f target_commitish="$RELEASE_SHA"
